<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица умножения</title>
</head>
<body>
    <h2>Таблица умножения</h2>
    <div id="tableContainer"></div>
    
    <script>
        let tableHTML = "<table border='1'>";
        
        for (let i = 1; i <= 10; i++) {
            tableHTML += "<tr>";
            for (let j = 1; j <= 10; j++) {
                tableHTML += "<td>" + i + "×" + j + "=" + (i * j) + "</td>";
            }
            tableHTML += "</tr>";
        }
        
        tableHTML += "</table>";
        document.querySelector("#tableContainer").innerHTML = tableHTML;
    </script>
</body>
</html>
