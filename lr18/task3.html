<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Светофор</title>
    <style>
        .traffic-light {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: gray;
            border: 2px solid #333;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="traffic-light">
        <div class="circle" id="redLight"></div>
        <div class="circle" id="yellowLight"></div>
        <div class="circle" id="greenLight"></div>
    </div>
    <button id="redBtn">Красный</button>
    <button id="yellowBtn">Жёлтый</button>
    <button id="greenBtn">Зелёный</button>

    <script>
        let red = document.querySelector("#redLight");
        let yellow = document.querySelector("#yellowLight");
        let green = document.querySelector("#greenLight");

        function resetColors() {
            red.style.backgroundColor = "gray";
            yellow.style.backgroundColor = "gray";
            green.style.backgroundColor = "gray";
        }

        document.querySelector("#redBtn").onclick = function() {
            resetColors();
            red.style.backgroundColor = "red";
        };

        document.querySelector("#yellowBtn").onclick = function() {
            resetColors();
            yellow.style.backgroundColor = "yellow";
        };

        document.querySelector("#greenBtn").onclick = function() {
            resetColors();
            green.style.backgroundColor = "green";
        };
    </script>
</body>
</html>
