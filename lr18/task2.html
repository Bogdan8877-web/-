<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
</head>
<body>
    <input type="number" id="num1" placeholder="Число 1">
    <input type="number" id="num2" placeholder="Число 2">
    <button id="sumBtn">Сложить</button>
    <p id="resultSum"></p>

    <script>
        let num1 = document.querySelector("#num1");
        let num2 = document.querySelector("#num2");
        let sumBtn = document.querySelector("#sumBtn");
        let result = document.querySelector("#resultSum");

        sumBtn.onclick = function() {
            let a = Number(num1.value);
            let b = Number(num2.value);
            let sum = a + b;
            result.textContent = "Сумма = " + sum;
        };
    </script>
</body>
</html>
